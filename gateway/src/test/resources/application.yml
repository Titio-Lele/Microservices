eureka:
  client:
    enabled: false

spring:
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: log-service
              uri: lb://log
              predicates:
                - Path=/gateway/log/**
              filters:
                - StripPrefix=2
    discovery:
      client:
        simple:
          instances:
            log:
              - uri: http://localhost:8082

